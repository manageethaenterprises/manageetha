<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Manaswini Enterprises ERP</title>
  <meta name="description" content="Multi-Tenant Business ERP System — Login Portal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
  <link rel="stylesheet" href="/admin/login.css">
</head>
<body>
  <div class="login-container">
    <div class="top-nav-bar">
      <a href="/" class="back-link">← Back to Landing Page</a>
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">🌙</button>
    </div>

    <div class="login-bg-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="login-card" id="loginCard">
      <div class="login-header">
        <div class="logo-icon">ME</div>
        <h1>Manaswini Enterprises</h1>
        <p>Multi-Tenant Enterprise Portal</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Username / Email / Phone</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" placeholder="Enter your credentials" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePassword">👁️</button>
          </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader" style="display:none;">⏳</span>
        </button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <button type="button" class="init-db-btn" id="initDbBtn">
        <span>⚡ Initialize Database</span>
      </button>

      <div class="setup-status" id="setupStatus" style="display:none;"></div>

      <div class="login-footer">
        <p>© 2026 Manaswini Enterprises & Geetha Enterprises — All Rights Reserved</p>
        <p style="font-size: 11px; margin-top: 6px; opacity: 0.9;">
          <a href="/privacy-policy.html" target="_blank" style="color: inherit; text-decoration: underline;">Privacy Policy</a> | 
          <a href="/refund-policy.html" target="_blank" style="color: inherit; text-decoration: underline;">Return Policy</a> | 
          <a href="/terms-of-service.html" target="_blank" style="color: inherit; text-decoration: underline;">Terms of Service</a>
        </p>
        <p style="font-size: 11px; margin-top: 4px; opacity: 0.85;">Developed & Maintained by <a href="https://inspenox.in" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;"><strong>Inspenox</strong></a></p>
      </div>
    </div>
  </div>

  <script src="/admin/login.js"></script>
</body>
</html>
